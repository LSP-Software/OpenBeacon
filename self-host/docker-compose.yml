# OpenBeacon server. Copy .env.example to .env, fill it in, then run `docker compose up -d`.
# Guide: https://docs.openbeacon.net/docs/self-host/quick-start-with-docker

name: openbeacon

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${OPENBEACON_DOMAIN:?}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internet, storage]
    depends_on:
      - backend
      - storage

  backend:
    image: lspsoftware/openbeacon-backend:latest-stable
    restart: unless-stopped
    environment:
      BETTER_AUTH_URL: https://${OPENBEACON_DOMAIN:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      DATABASE_URL: postgresql://openbeacon:${POSTGRES_PASSWORD:?}@db:5432/openbeacon
      REDIS_URL: redis://valkey:6379
      REDIS_HASH_SECRET: ${REDIS_HASH_SECRET:?}
      TRUSTED_PROXY_PROVIDER: trusted-proxy
      IMAGES_S3_ENDPOINT: http://storage:7070
      IMAGES_S3_PUBLIC_ENDPOINT: https://${OPENBEACON_DOMAIN:?}
      IMAGES_S3_CDN_URL: https://${OPENBEACON_DOMAIN:?}
      IMAGES_S3_REGION: us-east-1
      IMAGES_S3_ACCESS_KEY_ID: pictures
      IMAGES_S3_ACCESS_KEY: ${STORAGE_PICTURES_SECRET_KEY:?}
      IMAGES_S3_BUCKET_NAME: openbeacon-pictures
      IMAGES_S3_FORCE_PATH_STYLE: true
      MAP_S3_ENDPOINT: http://storage:7070
      MAP_S3_PUBLIC_ENDPOINT: https://${OPENBEACON_DOMAIN:?}
      MAP_S3_REGION: us-east-1
      MAP_S3_ACCESS_KEY_ID: map
      MAP_S3_ACCESS_KEY: ${STORAGE_MAP_SECRET_KEY:?}
      MAP_S3_BUCKET_NAME: openbeacon-map
      MAP_S3_FORCE_PATH_STYLE: true
    networks: [internet, database, cache, storage]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully

  scheduled-jobs:
    image: lspsoftware/openbeacon-scheduled-jobs:latest-stable
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://openbeacon:${POSTGRES_PASSWORD:?}@db:5432/openbeacon
      IMAGES_S3_ENDPOINT: http://storage:7070
      IMAGES_S3_CDN_URL: https://${OPENBEACON_DOMAIN:?}
      IMAGES_S3_REGION: us-east-1
      IMAGES_S3_ACCESS_KEY_ID: pictures
      IMAGES_S3_ACCESS_KEY: ${STORAGE_PICTURES_SECRET_KEY:?}
      IMAGES_S3_BUCKET_NAME: openbeacon-pictures
      IMAGES_S3_FORCE_PATH_STYLE: true
    networks: [internet, database, storage]
    depends_on:
      backend:
        condition: service_healthy

  map-tiles:
    image: lspsoftware/openbeacon-map-tiles:latest-stable
    restart: unless-stopped
    environment:
      MAP_S3_ENDPOINT: http://storage:7070
      MAP_S3_REGION: us-east-1
      MAP_S3_ACCESS_KEY_ID: map
      MAP_S3_ACCESS_KEY: ${STORAGE_MAP_SECRET_KEY:?}
      MAP_S3_BUCKET_NAME: openbeacon-map
      MAP_S3_FORCE_PATH_STYLE: true
    volumes:
      - map_tiles_state:/state
    networks: [internet, storage]
    depends_on:
      storage-setup:
        condition: service_completed_successfully

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: openbeacon
      POSTGRES_USER: openbeacon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: pg_isready -U openbeacon -d openbeacon
      interval: 10s

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    volumes:
      - valkey:/data
    networks: [cache]
    healthcheck:
      test: valkey-cli ping
      interval: 10s

  storage:
    image: versity/versitygw:v1.11.0
    restart: unless-stopped
    entrypoint: sh -c "mkdir -p /data/buckets /data/versions /data/iam && exec docker-entrypoint.sh"
    environment:
      ROOT_ACCESS_KEY: admin
      ROOT_SECRET_KEY: ${STORAGE_ADMIN_SECRET_KEY:?}
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data/buckets
      VGW_VERSIONING_DIR: /data/versions
      VGW_IAM_DIR: /data/iam
      VGW_ADMIN_PORT: :7071
      VGW_HEALTH: /health
      VGW_QUIET: true
      VGW_FSYNC: true
    volumes:
      - storage:/data
    networks: [storage]
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:7070/health
      interval: 10s

  storage-setup:
    image: curlimages/curl:8.23.0
    restart: on-failure
    environment:
      ADMIN_KEY: ${STORAGE_ADMIN_SECRET_KEY:?}
      PICTURES_KEY: ${STORAGE_PICTURES_SECRET_KEY:?}
      MAP_KEY: ${STORAGE_MAP_SECRET_KEY:?}
    entrypoint: sh -ec
    command:
      - |
        admin() { curl -fsS -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user "admin:$$ADMIN_KEY" "$$@"; }
        user() {
          admin -X PATCH http://storage:7071/create-user --data-binary "<Account><Access>$$1</Access><Secret>$$2</Secret><Role>user</Role></Account>" 2>/dev/null ||
            admin -X PATCH "http://storage:7071/update-user?access=$$1" --data-binary "<MutableProps><Secret>$$2</Secret></MutableProps>"
        }
        bucket() {
          admin -I "http://storage:7070/$$1" 2>/dev/null || admin -X PUT "http://storage:7070/$$1"
          admin -X PATCH "http://storage:7071/change-bucket-owner/?bucket=$$1&owner=$$2"
        }
        user pictures "$$PICTURES_KEY"
        user map "$$MAP_KEY"
        bucket openbeacon-pictures pictures
        bucket openbeacon-map map
        admin -X PUT "http://storage:7070/openbeacon-pictures?versioning" --data-binary '<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>'
        admin -X PUT "http://storage:7070/openbeacon-pictures?policy" --data-binary '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::openbeacon-pictures/*"}]}'
        echo "Storage is ready"
    networks: [storage]
    depends_on:
      storage:
        condition: service_healthy

configs:
  caddyfile:
    content: |
      {$$SITE_ADDRESS} {
        @storage path /openbeacon-pictures/* /openbeacon-map/*
        handle @storage {
          @notAllowed {
            not method GET HEAD PUT
          }
          respond @notAllowed 405
          @signedWithHeader header Authorization *
          respond @signedWithHeader 403
          reverse_proxy storage:7070
        }
        handle {
          reverse_proxy backend:3000
        }
      }

networks:
  internet:
  database:
    internal: true
  cache:
    internal: true
  storage:
    internal: true

volumes:
  db:
  valkey:
  storage:
  map_tiles_state:
  caddy_data:
  caddy_config:
