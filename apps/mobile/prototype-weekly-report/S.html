<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="week.js"></script></head><body style="flex-wrap:wrap;width:1440px"><script>
const shell=(title,nav,body)=>phone(status+`<div style="padding:8px 16px 0"><div style="font-size:22px;margin:6px 4px 14px">${title}</div>${nav}<div style="margin-top:16px">${body}</div></div>`,'height:760px');
const empty=(t,s)=>`<div style="text-align:center;padding:26px 10px;background:var(--sc0);border-radius:20px"><div style="width:64px;height:64px;border-radius:32px;background:var(--scc);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--onv)">${ic('car',28)}</div><div style="font-size:18px;font-weight:500">${t}</div><div class="muted" style="font-size:14px;margin-top:6px;line-height:1.4">${s}</div></div>`;
const S1lost=[['S','Speeding','once',3],['B','Hard braking','none',0],['A','Rapid acceleration','none',0],['P','Phone use','none',0]];
document.body.innerHTML=[
frame("S1 · Your own week","The driver sees the same report as everyone else, worded to them, and is told who else sees it.",
shell('Your week',weekNav('Mon 16 – Sun 22 Nov','Last week'),scoreBlock()+`<div style="margin-top:12px">${seeAlso('Family sees this report for the drives you share with them. Nobody is ranked against anyone else.')}</div>`)),
frame("S2 · Covers Sat–Sun","Sam shares drives with Family only from Saturday, so a Family member sees two days. The earlier week isn't shared, so there is nothing to compare.",
shell("Sam's week",weekNav('Mon 16 – Sun 22 Nov',`<span class="tag warn" style="margin-top:4px">Covers Sat–Sun</span>`),scoreBlock({n:97,prev:null,lost:S1lost,dist:'31 mi'})+`<div style="margin-top:14px">${dayBars([['M',0],['T',0],['W',0],['T',0],['F',0],['S',1,90],['S',1,98]],5)}</div><div class="info" style="margin-top:12px">${ic('info',18)}<div>Sam shares drives with Family from Sat 21 Nov. Earlier days aren't shown.</div></div>`)),
frame("S3 · This week so far","The current week is labelled as unfinished. Its totals sit next to the same days of last week, so a Tuesday isn't measured against a whole week.",
shell("Sam's week",weekNav('Mon 23 – Sun 29 Nov',`<span class="tag" style="margin-top:4px">So far · Mon–Tue</span>`,false),scoreBlock({n:84,prev:86,dist:'61 mi',lost:[['S','Speeding','twice',9],['B','Hard braking','once',4],['A','Rapid acceleration','once',2],['P','Phone use','once',1]]}).replace('vs last week','vs Mon–Tue last week')+`<div style="margin-top:12px">${statGrid([['4','drives','3 on Mon–Tue last week'],['70.6 mi','distance','12 mi more']])}</div>`)),
frame("S4 · No drives this week","The report stays, with last week underneath so the empty week isn't a dead end.",
shell("Sam's week",weekNav('Mon 16 – Sun 22 Nov','Last week'),empty('No drives this week','Sam didn’t record any drives from Mon 16 to Sun 22 Nov.')+`<div class="item" style="border-radius:16px;margin-top:12px"><div class="t"><div style="font-weight:500">Week before</div><small>9 drives · 165 mi · Driving score 82</small></div>${ic('chevron-right',20)}</div>`)),
frame("S5 · Only Passenger drives","No Driving score when every drive was a Passenger drive. They're still listed apart.",
shell("Sam's week",weekNav('Mon 16 – Sun 22 Nov','Last week'),empty('No Driving score this week','All 3 of Sam’s drives were Passenger drives, so none of them count.')+`<div style="margin-top:12px">${passLine(3,'41.2 mi')}</div>`)),
frame("S6 · Drive detection is off","What members see instead of a report while Sam has it off.",
shell("Sam's week",weekNav('Mon 16 – Sun 22 Nov','Last week'),`<div style="text-align:center;padding:26px 10px;background:var(--sc0);border-radius:20px"><div style="width:64px;height:64px;border-radius:32px;background:var(--scc);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--onv)">${ic('circle-off',28)}</div><div style="font-size:18px;font-weight:500">Drive detection is off</div><div class="muted" style="font-size:14px;margin-top:6px;line-height:1.4">Sam's Phone isn't recording drives. Only Sam can turn it on.</div></div>`)),
].join("");
</script></body></html>
