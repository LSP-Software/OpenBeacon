<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="crash.js"></script></head><body><script>
const step=(icon,c,t,s,last)=>`<div class="row" style="align-items:flex-start;gap:12px;position:relative"><div style="width:32px;height:32px;border-radius:16px;background:${c};display:flex;align-items:center;justify-content:center;flex:none;z-index:1">${ic(icon,17,'#fff',2.4)}</div>${last?'':`<div style="position:absolute;left:15px;top:32px;bottom:-8px;width:2px;background:var(--olv)"></div>`}<div style="padding-bottom:14px"><div style="font-size:15.5px;font-weight:500">${t}</div><div class="muted" style="font-size:13.5px">${s}</div></div></div>`;
const base=(steps,title)=>phone(plainMap+status.replace('18:20','18:09')+mapTop+crashAt(196,400)+pinAt(232,435)+`<svg style="position:absolute;inset:0;z-index:1" viewBox="0 0 412 915"><path d="M196 400 L214 418 L232 435" stroke="${RED}" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round" fill="none"/></svg><div class="sheet" style="padding:10px 20px 26px"><div class="grab"></div><div class="row" style="margin-bottom:14px">${av('Sa',44)}<div class="sp"><div style="font-size:20px;font-weight:700">${title}</div><div class="muted" style="font-size:14px">Family and Work</div></div></div>${steps}${btnRow(updBtns)}<div class="muted" style="font-size:12.5px;line-height:1.4;margin-top:12px">OpenBeacon hasn't contacted emergency services. Call 999 if you think Sam needs help. Crash alerts may help, but they can go off when nothing happened.</div></div>`);
document.body.innerHTML=[
frame("RC1&ensp;Tapped the Crash alert","A Crash alert sheet with what has happened so far, newest at the bottom. A dotted line joins the crash spot to where Sam is now.",
base(step('triangle-alert',RED,'Possible crash','18:04 on Barnet Lane, 42 mph just before')+step('send','#5d5358','Crash alert sent','18:05, after Sam didn\'t answer the countdown')+step('refresh-cw','#2E7D32','Sharing every 10 s','Last update 8 s ago, until 18:19',true),'Sam: possible crash')),
frame("RC2&ensp;Sam says they're OK","A green step is added. The sheet stays until it's closed, then the usual person card is back.",
base(step('triangle-alert',RED,'Possible crash','18:04 on Barnet Lane, 42 mph just before')+step('send','#5d5358','Crash alert sent','18:05')+step('circle-check','#2E7D32',"Sam says they're OK",'18:09',true),"Sam says they're OK")),
].join("");
</script></body></html>
