<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="crash.js"></script></head><body><script>
const hdr=(t,s,bar)=>`<div style="background:#2B1416;color:#fff;padding:0 0 26px;height:360px">${statusW}<div style="padding:18px 26px 0"><div class="row" style="gap:10px;color:#FFB4AB;font-weight:600;font-size:15px">${ic('siren',20,'#FFB4AB')}OpenBeacon</div><div style="font-size:32px;font-weight:600;margin-top:16px;line-height:1.15">${t}</div><div style="font-size:17px;opacity:.85;margin-top:8px;line-height:1.4">${s}</div>${bar==null?'':`<div style="height:10px;border-radius:5px;background:rgba(255,255,255,.18);margin-top:22px;overflow:hidden"><div style="width:${bar*100}%;height:100%;background:#FFB4AB"></div></div>`}</div></div>`;
const sheet=(inner)=>`<div style="position:absolute;left:0;right:0;top:330px;bottom:0;background:var(--s);border-radius:28px 28px 0 0;padding:22px 20px 0">${inner}</div>`;
const what=(t,rows)=>`<div style="font-size:14px;font-weight:600;color:var(--onv);margin-bottom:8px">${t}</div><div style="background:var(--sc0);border-radius:18px;padding:4px 14px;margin-bottom:16px">${rows.map(([i,a,b])=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--sch);font-size:15px"><span style="color:var(--onv)">${ic(i,18)}</span><span class="sp">${a}</span><span class="muted" style="font-size:14px">${b}</span></div>`).join('').replace('border-top:1px solid var(--sch);','')}</div>`;
const grid=(a,b,c,d)=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${a}${b}${c}${d}</div>`;
const tile=(t,icon,st)=>`<div class="btn ${st}" style="height:56px;font-size:16px">${ic(icon,19)}${t}</div>`;
const foot=`<div class="muted" style="font-size:12.5px;line-height:1.4;margin-top:14px">${MAYHELP}</div>`;
document.body.innerHTML=[
frame("DB1 · Counting down","A dark header with a draining bar, then a sheet showing exactly what the alert will say and who gets it. I'm OK spans the width.",
phone(hdr('Possible crash','Crash alert sends in 47 seconds',47/60)+sheet(what('Family and Work will see',[['clock','Time','18:04'],['map-pin','Where','Barnet Lane, EN5'],['gauge','Speed before','42 mph']])+`<div class="btn" style="height:72px;font-size:24px;border-radius:36px;margin-bottom:10px;background:${GREEN}">${ic('check',26)}I'm OK</div>`+grid(tile('Send now','send','tonal'),tile('Call 999','phone','tonal'),`<div style="grid-column:span 2">${tile('Text someone','message-square','out')}</div>`,'')+foot))),
frame("DB2 · Alert sent","Each Group shows when it was sent. The sheet says how long live updates last. I'm OK sends the follow-up.",
phone(hdr('Crash alert sent','Sharing your location every 10 seconds until 18:20')+sheet(what('Sent',[['users','Family','18:05'],['users','Work','18:05'],['refresh-cw','Last location sent','6 s ago']])+`<div class="btn" style="height:72px;font-size:22px;border-radius:36px;margin-bottom:4px;background:${GREEN}">${ic('check',24)}I'm OK, tell them</div><div class="muted" style="text-align:center;font-size:13px;margin-bottom:12px">Family and Work see “Sam says they're OK”</div>`+grid(tile('Call 999','phone','tonal'),tile('Text someone','message-square','tonal'),'','')+foot))),
frame("DB3 · Not sent yet","No signal. Each Group shows “Waiting for signal” and the 2-hour limit. Call 999 moves to the top.",
phone(hdr('Not sent yet','No signal. It sends as soon as your phone connects.').replace(statusW,statusNo())+sheet(what('Waiting',[['users','Family','Waiting for signal'],['users','Work','Waiting for signal'],['clock-alert','Gives up at','20:04']])+`<div class="btn" style="height:72px;font-size:22px;border-radius:36px;margin-bottom:4px;background:${RED}">${ic('phone',24)}Call 999</div><div class="muted" style="text-align:center;font-size:13px;margin-bottom:12px">Emergency calls can work without signal</div>`+grid(tile("I'm OK",'check','tonal'),tile('Text someone','message-square','tonal'),'','')+foot))),
].join("");
</script></body></html>
