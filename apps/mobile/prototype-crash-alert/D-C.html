<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="crash.js"></script></head><body><script>
const okRing=(n,frac,label,sub,c=GREEN)=>{const s=300,r=s/2-9,C=2*Math.PI*r;return `<div style="position:relative;width:${s}px;height:${s}px;margin:0 auto"><svg width="${s}" height="${s}" style="position:absolute;transform:rotate(-90deg)"><circle cx="${s/2}" cy="${s/2}" r="${r}" stroke="var(--sch)" stroke-width="10" fill="none"/><circle cx="${s/2}" cy="${s/2}" r="${r}" stroke="${RED}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C*frac} ${C}"/></svg><div style="position:absolute;inset:22px;border-radius:50%;background:${c};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.2)">${ic(label[1],44,'#fff',2.6)}<div style="font-size:34px;font-weight:700;margin-top:6px">${label[0]}</div><div style="font-size:15px;opacity:.9;margin-top:4px;text-align:center;padding:0 30px">${sub}</div></div></div>`;};
const three=(items)=>`<div class="row" style="gap:10px;padding:0 20px">${items.map(([t,i,c])=>`<div style="flex:1;height:84px;border-radius:20px;background:${c||'var(--scc)'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:600;color:${c?'#fff':'var(--on)'}">${ic(i,22,c?'#fff':'currentColor')}${t}</div>`).join('')}</div>`;
const head=(t,s,c=RED)=>`<div style="text-align:center;padding:26px 30px 24px"><div style="font-size:28px;font-weight:700;color:${c}">${t}</div><div style="font-size:16px;color:var(--onv);margin-top:6px;line-height:1.4">${s}</div></div>`;
const foot=`<div class="muted" style="position:absolute;left:26px;right:26px;bottom:30px;font-size:12.5px;line-height:1.4;text-align:center">${MAYHELP}</div>`;
document.body.innerHTML=[
frame("DC1 · Counting down","A light screen built around one huge I'm OK button. The countdown is the red ring around it. Everything else is a small row underneath.",
phone(status.replace('18:20','18:04')+head('Possible crash','Crash alert to Family and Work in 47 s')+okRing(47,47/60,["I'm OK",'check'],'47 s left')+`<div style="height:34px"></div>`+three([['Send now','send'],['Call 999','phone'],['Text someone','message-square']])+foot)),
frame("DC2 · Alert sent","The ring is full. The big button stays I'm OK and now sends the follow-up. Live updates run underneath.",
phone(status.replace('18:20','18:05')+head('Crash alert sent','Family and Work got it at 18:05. Sharing your location every 10 s until 18:20.')+okRing(0,1,["I'm OK",'check'],'Tell them you\'re OK')+`<div style="height:34px"></div>`+three([['Call 999','phone'],['Text someone','message-square']])+foot)),
frame("DC3 · Not sent yet","No signal. The big button becomes Call 999. I'm OK moves into the row and simply cancels the waiting alert.",
phone(statusNo('var(--on)')+head('Not sent yet','No signal. Your Crash alert sends as soon as your phone connects, for the next 2 hours.')+okRing(0,1,['Call 999','phone'],'Emergency calls can work without signal',RED)+`<div style="height:34px"></div>`+three([["I'm OK",'check'],['Text someone','message-square']])+foot)),
].join("");
</script></body></html>
