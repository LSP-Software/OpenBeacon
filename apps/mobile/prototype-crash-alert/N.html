<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="crash.js"></script></head><body><script>
const hrow=(icon,c,t,time)=>`<div class="item" style="min-height:56px"><div class="ic" style="background:${c};color:#fff">${ic(icon,19,'#fff')}</div><div class="t" style="font-size:15px">${t}</div><span class="muted" style="font-size:13px">${time}</span></div>`;
const seg3=`<div class="seg"><div>${ic('calendar-days',18)}Day</div><div class="on">${ic('car',18)}Drives</div><div>${ic('chart-column',18)}Week</div></div>`;
document.body.innerHTML=[
frame("N1 · Received: Crash alert, then OK","The Crash alert arrives on its own alarm channel. The OK follow-up is a normal-priority notification from the same type.",
lock(notif({title:'Sam: possible crash',body:'At 18:04 near Barnet Lane, 42 mph just before. Tap to see where Sam is now.',acts:'Show on map<span>Directions</span>',ch:'Crash alerts',when:'1 min'})+notif({icon:'circle-check',ic1:'#2E7D32',title:"Sam says they're OK",body:'After a possible crash at 18:04.',ch:'Crash alerts',when:'now'}),'18:09')),
frame("N2 · Received: late, and from two devices","Sent after no signal: the crash time leads and the sent time follows. Alerts from Sam's phone and tablet within 5 minutes merge into one.",
lock(notif({title:'Sam: possible crash at 18:06',body:'Sent at 18:31, after Sam\'s phone had no signal. Near Mays Lane, 38 mph just before.',acts:'Show on map<span>Directions</span>',ch:'Crash alerts',when:'now'})+notif({title:'Sam: possible crash',body:'At 18:04 near Barnet Lane. Sent by Sam\'s Phone and Sam\'s Tablet.',acts:'Show on map<span>Directions</span>',ch:'Crash alerts',when:'yesterday'}),'18:31')),
frame("N3 · Driver: heads-up fallback and later notices","Where Android won't show the full screen, an alarm notification with the same buttons. Below: the live-sharing notice after sending, and the 2-hour give-up notice.",
phone(plainMap+`<div style="position:absolute;inset:0;background:rgba(0,0,0,.35)"></div><div class="status" style="color:#fff"><span>18:04</span><span>▼◢ ▮</span></div><div style="position:relative;z-index:6;margin-top:6px">`+notif({title:'Possible crash · Crash alert in 47 s',body:'Sending to Family and Work when the timer ends. Tap to open.',acts:"I'm OK<span>Send now</span><span>Call 999</span>",ch:'Crash countdown'})+`<div style="color:#fff;font-size:13px;margin:22px 24px 8px;font-weight:600">LATER, IN THE NOTIFICATION SHADE</div>`+notif({icon:'refresh-cw',ic1:'var(--brand)',title:'Sharing every 10 s after a Crash alert',body:'Until 18:20. Family and Work can see where you are.',acts:"I'm OK",ch:'Sharing',when:'18:05'})+notif({icon:'circle-x',ic1:'#5d5358',title:'Crash alert not sent',body:'Your phone had no signal for 2 hours after a possible crash at 18:06, so the alert was dropped. Nobody was told.',ch:'Crash countdown',when:'20:06'})+`</div>`)),
frame("N4 · Group History","Both entries go in the Group's History with the crash time. A late alert says when it arrived.",
screen('Family',`<div style="padding:4px 16px 10px"><div class="seg"><div>Members</div><div>Places</div><div class="on">History</div><div>Settings</div></div></div><div class="day">TODAY</div><div class="grp">${hrow('circle-check','#2E7D32',"Sam says they're OK",'18:09')}${hrow('siren',RED,"Sam's phone sent a Crash alert: possible crash at 18:04 near Barnet Lane",'18:05')}${hrow('refresh-cw','#857377','Jo asked for Sam\'s location','17:40')}</div><div class="day">YESTERDAY</div><div class="grp">${hrow('siren',RED,"Sam's phone sent a Crash alert: possible crash at 18:06 near Mays Lane (arrived 18:31, after no signal)",'18:31')}${hrow('user','#857377','Lou joined','09:12')}</div>`)),
frame("N5 · “Crash alerts are off”","Shown where Sam's Drives show (Drives list, the drive detail and the Week view), the same way as “Drive detection is off”. No notification.",
screen('Timeline',`<div style="padding:4px 12px 0">${seg3}<div class="row" style="margin:12px 2px 0;gap:8px"><div class="gchip" style="background:var(--sc);height:36px">${av('Sa',24)}Sam${ic('chevron-down',16)}</div><div class="gchip" style="height:36px;font-size:14px">${ic('smartphone',16)}Phone${ic('chevron-down',16)}</div></div></div><div class="info" style="margin:14px 12px 0">${ic('bell-off',18)}<div><b>Crash alerts are off</b> on Sam's Phone. Only Sam can turn them on.</div></div><div class="day">TODAY</div><div class="grp"><div class="item"><div class="ic">${ic('car',20)}</div><div class="t">17:30 – 18:12<small>14.2 mi · 42 min · top 58 mph</small></div>${score(88)}</div><div class="item"><div class="ic">${ic('car',20)}</div><div class="t">08:29 – 08:58<small>9.8 mi · 29 min · top 47 mph</small></div>${score(92)}</div></div>`)),
].join("");
</script></body></html>
