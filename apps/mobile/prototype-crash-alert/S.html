<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="crash.js"></script></head><body><script>
const sh=(t)=>`<div class="sh">${t}</div>`;
const tryBtn=`<div class="btn tonal" style="margin:12px 12px 0">${ic('flask-conical',18)}Try it</div><div class="muted" style="font-size:13px;margin:6px 24px 0;text-align:center">Runs the countdown on this phone. Nobody is alerted.</div>`;
const may=`<div class="info" style="margin:12px 12px 0">${ic('info',18)}<div>${MAYHELP}</div></div>`;
const driveRows=(crash,crashSub,dis=false)=>`<div class="grp">${settingRow('Drive detection','Records your drives and shares them with your Groups',true,'car')}${settingRow('Crash alerts',crashSub,crash,'siren',dis)}</div>`;
const sub='If this phone suspects a crash during a drive and nobody taps I\'m OK within 60 s, Family and Work get a Crash alert with the time, place and speed.';
const tryScreen=(inner)=>phone(`<div style="background:#455A64;color:#fff;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;position:relative;z-index:6">${ic('flask-conical',16,'#fff')}Test: nobody will be alerted</div>`+inner,`background:${RED};color:#fff`);
document.body.innerHTML=[
frame("S1&ensp;Account › Drive detection","Crash alerts sits under Drive detection, on by default. The may-help wording and Try it are always on this screen.",
screen('Drive detection',driveRows(true,sub)+may+tryBtn)),
frame("S2&ensp;Self-hosted server without pushes","The same screen adds a note that alerts are slow on this server and points to the phone's own crash detection.",
screen('Drive detection',driveRows(true,sub)+`<div class="note" style="margin:12px 12px 0">${ic('server',18,'var(--warn)')}<div>Your server doesn't send push notifications, so a Crash alert can take several minutes to reach others. Your phone may have its own crash detection that can call 999 for you (Pixel Safety or iPhone Crash Detection).<div style="font-weight:600;margin-top:6px;color:var(--warn)">Open phone safety settings</div></div></div>`+may+tryBtn)),
frame("S3&ensp;Paused, or Drive detection off","The switch says why nothing is sent. Paused keeps the switch on but sends nothing. With Drive detection off it greys out.",
screen('Drive detection',driveRows(true,'Location sharing is paused, so no Crash alert would be sent. Resume sharing to turn them back on.')+`<div class="day" style="font-size:14px;color:var(--p);letter-spacing:0;padding-top:22px">With Drive detection off</div><div class="grp">${settingRow('Drive detection','Off on this phone',false,'car')}${settingRow('Crash alerts','Needs Drive detection',false,'siren',true)}</div>`+may)),
frame("S4&ensp;Try it: counting down","The real countdown (in whichever style is picked) with a grey Test strip. It counts from 10 so trying it is quick. Sound and vibration play. Call 999 and Text someone are left out.",
tryScreen(`<div style="text-align:center;padding:40px 28px 0"><div style="font-size:30px;font-weight:600">Possible crash</div><div style="font-size:16px;opacity:.9;margin-top:6px">This is a test. In a real crash, Family and Work would get a Crash alert when the timer ends.</div></div><div style="margin:30px 0 26px">${ring(7,.7)}</div><div style="padding:0 24px;display:flex;flex-direction:column;gap:12px">${big("I'm OK",{h:80,fs:26})}${big('Send alert now',{bg:'transparent',fg:'#fff',h:56,fs:18,b:'border:2px solid rgba(255,255,255,.7)'})}</div>`)),
frame("S5&ensp;Try it: finished","When the timer ends or Send alert now is tapped. Nothing leaves the phone.",
screen('Drive detection',`<div style="text-align:center;padding:60px 30px 0"><div style="width:80px;height:80px;border-radius:40px;background:var(--scc);display:inline-flex;align-items:center;justify-content:center">${ic('circle-check',40,'#2E7D32')}</div><div style="font-size:24px;font-weight:500;margin-top:16px">Test finished</div><div class="muted" style="font-size:15px;line-height:1.45;margin-top:8px">In a real crash, Family and Work would have got a Crash alert now, and your phone would share its location every 10 seconds for 15 minutes. Nobody was alerted.</div><div class="btn" style="margin-top:26px">Done</div></div>`)),
frame("S6&ensp;Account › Notifications","Crash alerts is its own type, on by default. No per-person mute. On Android it can ask to sound during Do Not Disturb.",
screen('Notifications',sh('Alerts on this phone')+`<div class="grp">${settingRow('Place alerts','When people arrive at or leave places',true,'map-pin')}${settingRow('Drives','When someone finishes a drive',true,'car')}${settingRow('Crash alerts','When someone\'s phone sends a Crash alert. Sounds an alarm.',true,'siren')}</div>`+sh('Crash alerts')+`<div class="grp">${settingRow('Sound during Do Not Disturb','Allowed',null,'bell-ring')}</div><div class="muted" style="font-size:13px;margin:8px 24px;line-height:1.4">Crash alerts can't be muted for one person. Turning them off here only stops them on this phone.</div>`)),
].join("");
</script></body></html>
