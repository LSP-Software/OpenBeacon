<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="crash.js"></script></head><body><script>
const redBg=`background:${RED};color:#fff`;
const head=(icon,t,s)=>`<div style="text-align:center;padding:26px 28px 0"><div style="display:inline-flex;width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,.18);align-items:center;justify-content:center">${ic(icon,30,'#fff')}</div><div style="font-size:30px;font-weight:600;margin-top:12px">${t}</div><div style="font-size:16px;opacity:.9;margin-top:6px;line-height:1.4">${s}</div></div>`;
const small=(t,icon)=>`<div style="flex:1;height:56px;border-radius:28px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600">${ic(icon,20,'#fff')}${t}</div>`;
const foot=`<div style="position:absolute;left:28px;right:28px;bottom:30px;font-size:14px;text-align:center;line-height:1.4">${MAYHELP}</div>`;
document.body.innerHTML=[
frame("DA1&ensp;Counting down","Full-screen red alarm with sound and vibration. The ring counts down from 60. I'm OK is the biggest thing on the screen.",
phone(statusW+head('siren','Possible crash','Sending a Crash alert to Family and Work when the timer ends.')+`<div style="margin:20px 0 18px">${ring(47,47/60,260,'#fff','rgba(255,255,255,.25)',150)}</div><div style="padding:0 24px;display:flex;flex-direction:column;gap:12px">${big("I'm OK",{h:80,fs:26})}${big('Send alert now',{bg:'transparent',fg:'#fff',h:56,fs:18,b:'border:2px solid rgba(255,255,255,.7)'})}<div class="row" style="gap:12px">${small('Call 999','phone')}${small('Text someone','message-square')}</div></div>`+foot,redBg)),
frame("DA2&ensp;Alert sent","After the countdown (or Send alert now). The phone keeps sharing every 10 s for 15 minutes. I'm OK now sends “Sam says they're OK”.",
phone(statusW.replace("18:04","18:05")+head('send','Crash alert sent','Sent to Family and Work at 18:05. Sharing your location every 10 seconds until 18:20.')+`<div style="margin:40px 24px 0;display:flex;flex-direction:column;gap:12px">${big("I'm OK",{h:80,fs:26})}<div style="text-align:center;font-size:14px;opacity:.9;margin:-2px 0 8px">Tells Family and Work you're OK</div><div class="row" style="gap:12px">${small('Call 999','phone')}${small('Text someone','message-square')}</div></div>`+foot,`background:${REDD};color:#fff`)),
frame("DA3&ensp;Not sent yet","No signal when the countdown ended. The alert waits and sends when the phone connects, for up to 2 hours. Calling 999 still works.",
phone(statusNo()+head('wifi-off','Not sent yet','No signal. Your Crash alert sends as soon as your phone connects, for the next 2 hours.')+`<div style="margin:40px 24px 0;display:flex;flex-direction:column;gap:12px">${big('Call 999',{h:80,fs:26,icon:'phone'})}<div style="text-align:center;font-size:14px;opacity:.9;margin:-2px 0 8px">Emergency calls can work without signal</div><div class="row" style="gap:12px">${small("I'm OK",'check')}${small('Text someone','message-square')}</div></div>`+foot,`background:${REDD};color:#fff`)),
].join("");
</script></body></html>
