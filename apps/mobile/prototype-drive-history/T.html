<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="crash.js"></script><script src="drive.js"></script></head><body><script>
const sh=(t)=>`<div class="sh">${t}</div>`;
const sub='If this phone suspects a crash during a drive and nobody taps I\'m OK within 60 s, Family and Work get a Crash alert with the time, place and speed.';
const dtop=`<div class="grp">${settingRow('Drive detection','Records your drives and shares them with your Groups',true,'car')}${settingRow('Crash alerts',sub,true,'siren')}</div>`;
const grow=(c,name,s,on)=>`<div class="item"><div style="width:40px;height:40px;border-radius:20px;background:${c};flex:none"></div><div class="t">${name}<small>${s}</small></div>${sw(on)}</div>`;
const seg3=`<div class="seg"><div>${ic('calendar-days',18)}Day</div><div class="on">${ic('car',18)}Drives</div><div>${ic('chart-column',18)}Week</div></div>`;
document.body.innerHTML=[
frame("TA&ensp;Account › Drive detection lists your Groups","One switch per Group under Crash alerts, all on by default. The Group's own Settings tab has nothing new.",
screen('Drive detection',dtop+sh('Tell these Groups when I finish a drive')+`<div class="grp">${grow('#E6005C','Family','Members get a Drive alert',true)}${grow('#1565C0','Work','No Drive alerts. Your drives still show in their Timeline.',false)}</div>`+foot('A Drive alert gives the distance, time and top speed of a drive you just finished. It never includes your score or Driving events. Members of Work see “Drive alerts are off”.'))),
frame("TB&ensp;Group › Settings, next to your history","The switch sits under “Your location history” in each Group's Settings tab, because both say what this Group gets from you. Drive detection has nothing new.",
screen('Family',tabs('Settings')+sh('Your location history')+`<div class="grp">${settingRow('Last 30 days','The most this server keeps',null,'history')}</div>`+sh('Your drives')+`<div class="grp">${settingRow('Tell Family when I finish a drive','Members get a Drive alert with the distance, time and top speed. Never your score or Driving events.',true,'car')}</div>`+foot('Your drives show in Family\'s Timeline either way. Only you can change this.')+sh('Appearance')+`<div class="grp">${settingRow('Group colour','Pink',null,'users')}</div>`)),
frame("TC&ensp;Both places, one setting","TA's list in Drive detection, and the same switch in each Group's Settings tab. Changing either changes the other.",
screen('Family',tabs('Settings')+sh('Your location history')+`<div class="grp">${settingRow('Last 30 days','The most this server keeps',null,'history')}</div>`+sh('Your drives')+`<div class="grp">${settingRow('Tell Family when I finish a drive','Members get a Drive alert with the distance, time and top speed.',true,'car')}</div>`+foot('Also in Account › Drive detection, which lists all your Groups.'))),
frame("TD&ensp;What members of Work see","“Drive alerts are off” shows where Sam's drives show, like “Crash alerts are off”, and on the Drive alerts mute screen. No notification.",
screen('Timeline',`<div style="padding:4px 12px 0">${seg3}<div class="row" style="margin:12px 2px 0;gap:8px"><div class="gchip" style="background:var(--sc);height:36px">${av('Sa',24)}Sam${ic('chevron-down',16)}</div><div class="gchip" style="height:36px;font-size:14px">${ic('smartphone',16)}Phone${ic('chevron-down',16)}</div></div></div><div class="info" style="margin:14px 12px 0;font-size:14px">${ic('bell-off',18)}<div><b>Drive alerts are off.</b> Sam doesn't send Work a Drive alert when they finish a drive. Their drives still show here. Only Sam can change this.</div></div>`+dayH('Today')+`<div class="grp"><div class="item"><div class="ic">${ic('car',20)}</div><div class="t">17:30 – 18:12<small>14.2 mi, 42 min, top 58 mph</small></div>${score(88)}</div><div class="item"><div class="ic">${ic('car',20)}</div><div class="t">08:29 – 08:58<small>9.8 mi, 29 min, top 47 mph</small></div>${score(92)}</div></div>`)),
].join("");
</script></body></html>
