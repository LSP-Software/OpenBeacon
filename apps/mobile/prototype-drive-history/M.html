<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="parts.js"></script><script src="crash.js"></script><script src="drive.js"></script></head><body><script>
const card=(icon,emoji,title,summary,open,inner='')=>`<div style="background:var(--sc0);border-radius:24px;padding:14px 18px;margin:0 12px 12px"><div class="row"><div style="width:48px;height:48px;border-radius:12px;background:var(--scc);display:flex;align-items:center;justify-content:center;font-size:24px">${icon?ic(icon,24,DRV):emoji}</div><div class="sp"><div style="font-size:18px;font-weight:600">${title}</div><div class="muted" style="font-size:15px">${summary}</div></div>${ic(open?'chevron-down':'chevron-right',20,'var(--onv)')}</div>${inner}</div>`;
const everyone=(on,s='Includes people who join later')=>`<div class="row" style="border-top:1px solid var(--sch);padding:14px 0;margin-top:12px"><div class="sp"><div style="font-size:16px;font-weight:600">Mute everyone's drives</div><div class="muted" style="font-size:14px">${s}</div></div>${sw(on)}</div>`;
const people=memberSw('Sa','#E6005C','Sam','Alerts on',true)+memberSw('Jo','#1565C0','Jo','Alerts off',false)+memberSw('Lo','#2E7D32','Lou','Drive alerts are off. Lou doesn\'t send them to Family.',false,true);
const placesTabTop=`<div class="row" style="margin:0 16px 10px;justify-content:space-between"><div style="font-size:14px;font-weight:600;color:var(--p)">2 places</div><div class="btn tonal" style="height:36px">${ic('bell',16)}Alerts</div></div>`;
const personCard=(extra)=>phone(plainMap+status+mapTop+`<div class="card">${personHead()}${btnRow(updBtns)}${extra}</div>`);
document.body.innerHTML=[
frame("MA&ensp;In the Group's Alerts screen, above the places","Places › Alerts already holds place alert mutes. Drive alerts becomes the first card there, with the same switches. Lou's row explains why it can't be on.",
screen('Alerts',`<div class="muted" style="font-size:15px;margin:-6px 0 12px 66px">Family</div>`+card('car','','Drive alerts','Muted for Jo',true,everyone(false)+people)+card('','🏠','Home','On for everyone',false)+card('','🏫','School','Muted for Lou',false))),
frame("MB&ensp;Group › Settings › Your alerts","The Settings tab gains a “Your alerts” section with Place alerts and Drive alerts rows. Each opens its own screen. The Alerts button on Places opens the same place screen.",
screen('Family',tabs('Settings')+`<div class="sh">Your alerts</div><div class="grp">${settingRow('Place alerts','Muted for Lou at School',null,'map-pin').replace('</div></div>',`</div>${ic('chevron-right',18,'var(--onv)')}</div>`)}${settingRow('Drive alerts','Muted for Jo',null,'car').replace('</div></div>',`</div>${ic('chevron-right',18,'var(--onv)')}</div>`)}</div>`+foot('Only changes the alerts on your phones.')+`<div class="sh">Your location history</div><div class="grp">${settingRow('Last 30 days','The most this server keeps',null,'history')}</div><div class="sh">Your drives</div><div class="grp">${settingRow('Tell Family when I finish a drive','Members get a Drive alert',true,'car')}</div>`)),
frame("MB2&ensp;The Drive alerts screen from MB","Same switches as MA's card, on a screen of their own.",
screen('Drive alerts',`<div class="muted" style="font-size:15px;margin:-6px 0 12px 66px">Family</div><div style="background:var(--sc0);border-radius:24px;padding:0 18px 4px;margin:0 12px">${everyone(false).replace('margin-top:12px;border-top:1px solid var(--sch)','').replace('border-top:1px solid var(--sch);','')}${people}</div>`+foot('When someone in Family finishes a drive, you get a Drive alert with the distance, time and top speed. Muting only changes your alerts. Their drives still show in Timeline.'))),
frame("MP&ensp;From Sam's person card","Same row as “Mute everyone here” on a place's sheet. It only mutes Sam in the Group the card was opened from.",
personCard(`<div class="row" style="border-top:1px solid var(--sch);margin-top:14px;padding-top:12px"><div class="ic" style="width:40px;height:40px;border-radius:20px;background:var(--scc);display:flex;align-items:center;justify-content:center">${ic('car',20)}</div><div class="sp"><div style="font-size:16px;font-weight:600">Sam's Drive alerts</div><div class="muted" style="font-size:14px">In Family. Only changes your alerts.</div></div>${sw(true)}</div>`)),
].join("");
</script></body></html>
