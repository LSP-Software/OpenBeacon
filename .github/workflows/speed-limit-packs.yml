name: Speed limit packs

on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speed-limit-packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - name: Pick the build date
        id: build
        run: echo "build=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        continent:
          - africa
          - antarctica
          - asia
          - australia-oceania
          - central-america
          - europe
          - north-america
          - russia
          - south-america

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Geofabrik extracts
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the pack builder
        working-directory: apps/speed-limit-packs/builder
        run: ./gradlew installDist --no-daemon -q

      - name: Build packs
        working-directory: apps/speed-limit-packs/builder
        env:
          JAVA_OPTS: -Xmx12g
        run: >-
          build/install/openbeacon-speed-limit-packs/bin/openbeacon-speed-limit-packs build-continent
          --continent ${{ matrix.continent }}
          --build ${{ needs.plan.outputs.build }}
          --out "$RUNNER_TEMP/packs"
          --work "$RUNNER_TEMP/extracts"

      - name: Upload packs
        env:
          SPEED_LIMIT_PACKS_S3_ENDPOINT: ${{ secrets.SPEED_LIMIT_PACKS_S3_ENDPOINT }}
          SPEED_LIMIT_PACKS_S3_REGION: ${{ secrets.SPEED_LIMIT_PACKS_S3_REGION }}
          SPEED_LIMIT_PACKS_S3_ACCESS_KEY_ID: ${{ secrets.SPEED_LIMIT_PACKS_S3_ACCESS_KEY_ID }}
          SPEED_LIMIT_PACKS_S3_ACCESS_KEY: ${{ secrets.SPEED_LIMIT_PACKS_S3_ACCESS_KEY }}
          SPEED_LIMIT_PACKS_S3_BUCKET_NAME: ${{ secrets.SPEED_LIMIT_PACKS_S3_BUCKET_NAME }}
        run: bun run apps/speed-limit-packs/src/publish.ts upload "$RUNNER_TEMP/packs"

      - name: Keep the region list for the manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regions-${{ matrix.continent }}
          path: ${{ runner.temp }}/packs/regions.json
          retention-days: 7

  manifest:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Collect every continent's region list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: regions-*
          path: ${{ runner.temp }}/regions

      - name: Publish the manifest
        env:
          SPEED_LIMIT_PACKS_S3_ENDPOINT: ${{ secrets.SPEED_LIMIT_PACKS_S3_ENDPOINT }}
          SPEED_LIMIT_PACKS_S3_REGION: ${{ secrets.SPEED_LIMIT_PACKS_S3_REGION }}
          SPEED_LIMIT_PACKS_S3_ACCESS_KEY_ID: ${{ secrets.SPEED_LIMIT_PACKS_S3_ACCESS_KEY_ID }}
          SPEED_LIMIT_PACKS_S3_ACCESS_KEY: ${{ secrets.SPEED_LIMIT_PACKS_S3_ACCESS_KEY }}
          SPEED_LIMIT_PACKS_S3_BUCKET_NAME: ${{ secrets.SPEED_LIMIT_PACKS_S3_BUCKET_NAME }}
        run: >-
          bun run apps/speed-limit-packs/src/publish.ts manifest
          --build ${{ needs.plan.outputs.build }}
          "$RUNNER_TEMP"/regions/regions-*/regions.json
