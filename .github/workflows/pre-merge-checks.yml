name: Pre-merge checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI
        run: bun run ci

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openbeacon
          POSTGRES_USER: openbeacon
          POSTGRES_PASSWORD: openbeacon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbeacon -d openbeacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate database client and apply migrations
        run: |
          bun run --cwd packages/database --env-file=../../.env.ci prisma generate
          bun run --cwd packages/database --env-file=../../.env.ci prisma migrate deploy
      - name: Check the Prisma schema matches the migrations
        env:
          PGPASSWORD: openbeacon
          SHADOW_DATABASE_URL: postgresql://openbeacon:openbeacon@localhost:5432/openbeacon_shadow
        run: |
          psql -h localhost -U openbeacon -d openbeacon -c 'CREATE DATABASE openbeacon_shadow'
          bunx prisma migrate diff --config packages/database/prisma.config.ts --from-migrations packages/database/prisma/migrations --to-schema packages/database/prisma/schema.prisma --exit-code
      - name: Run every integration test file against PostgreSQL
        run: |
          mapfile -t files < <(find . -name '*.integration.test.ts' -not -path '*/node_modules/*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No integration test files found"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          OPENBEACON_INTEGRATION=1 bun test --isolate --env-file=.env.ci "${files[@]}"
