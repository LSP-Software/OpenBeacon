name: Update Docker Hub descriptions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    strategy:
      matrix:
        include:
          - image: openbeacon-backend
            summary: API server for OpenBeacon, end-to-end encrypted family location sharing you can self-host.
          - image: openbeacon-scheduled-jobs
            summary: Clean-up jobs and account deletion for a self-hosted OpenBeacon location sharing server.
          - image: openbeacon-map-tiles
            summary: Keeps the map up to date for a self-hosted OpenBeacon location sharing server.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: lspsoftware/${{ matrix.image }}
          short-description: ${{ matrix.summary }}
          readme-filepath: .github/dockerhub/${{ matrix.image }}.md
          enable-url-completion: true
