name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Trigger the Coolify deployment after publishing
        type: boolean
        default: false

concurrency:
  group: deploy-backend-${{ inputs.deploy && 'production' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.image_tags.outputs.version }}
      backend_digest: ${{ steps.backend_image.outputs.digest || steps.release_check.outputs.backend_digest }}
      scheduled_jobs_digest: ${{ steps.scheduled_jobs_image.outputs.digest || steps.release_check.outputs.scheduled_jobs_digest }}
    steps:
      - name: Require main branch for deployment
        if: inputs.deploy && github.ref != 'refs/heads/main'
        run: |
          echo 'Production images must be built from main.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare image tags
        id: image_tags
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^export const serverVersion = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' apps/backend/src/version.ts)
          if [ -z "$version" ]; then
            echo 'Could not read the backend version.' >&2
            exit 1
          fi
          branch=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[-.]+$//' | cut -c1-90)
          if [ -z "$branch" ]; then
            echo 'Branch name cannot be converted to an image tag.' >&2
            exit 1
          fi
          if [ "$BRANCH" != main ]; then
            branch="${branch}-$(printf '%s' "$BRANCH" | sha256sum | cut -c1-8)"
          fi
          {
            echo "version=${version}"
            echo 'tags<<EOF'
            echo "docker.io/lspsoftware/openbeacon-backend:branch-${branch}"
            echo "docker.io/lspsoftware/openbeacon-backend:${version}-${branch}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Require an unreleased version or a re-run of this commit's release
        id: release_check
        if: inputs.deploy
        env:
          VERSION: ${{ steps.image_tags.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          errors=$(mktemp)
          for image in openbeacon-backend openbeacon-scheduled-jobs; do
            ref="docker.io/lspsoftware/${image}:${VERSION}"
            if ! released=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2> "$errors"); then
              if ! grep -qxF "ERROR: ${ref}: not found" "$errors"; then
                echo "Could not check whether ${ref} exists:" >&2
                cat "$errors" >&2
                exit 1
              fi
              continue
            fi
            commit_ref="docker.io/lspsoftware/${image}:${COMMIT}"
            if ! commit_image=$(docker buildx imagetools inspect "$commit_ref" --format '{{.Manifest.Digest}}' 2> "$errors"); then
              if ! grep -qxF "ERROR: ${commit_ref}: not found" "$errors"; then
                echo "Could not check whether ${commit_ref} exists:" >&2
                cat "$errors" >&2
                exit 1
              fi
            fi
            if [ "$released" != "$commit_image" ]; then
              echo "${ref} already exists. Bump serverVersion in apps/backend/src/version.ts before deploying." >&2
              exit 1
            fi
            echo "${ref} is this commit's image; reusing ${released}."
            output_name="${image#openbeacon-}"
            echo "${output_name//-/_}_digest=${released}" >> "$GITHUB_OUTPUT"
          done
      - id: backend_image
        if: steps.release_check.outputs.backend_digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: docker.io/lspsoftware/openbeacon-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - id: scheduled_jobs_image
        if: steps.release_check.outputs.scheduled_jobs_digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/scheduled-jobs/Dockerfile
          push: true
          tags: docker.io/lspsoftware/openbeacon-scheduled-jobs:${{ github.sha }}
          cache-from: type=gha,scope=scheduled-jobs
          cache-to: type=gha,mode=max,scope=scheduled-jobs
      - name: Publish branch tags
        env:
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.digest || steps.release_check.outputs.backend_digest }}
          BACKEND_TAGS: ${{ steps.image_tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" "docker.io/lspsoftware/openbeacon-backend@${BACKEND_DIGEST}"
          done <<< "$BACKEND_TAGS"

  deploy:
    needs: publish
    if: inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions: {}
    steps:
      - name: Find Coolify application and check for an active deployment
        id: coolify_application
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          applications=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/applications")
          application=$(jq -cer 'if type != "array" then error("Expected an application list from Coolify") else [.[] | select(.name == "OpenBeacon Backend" and (.deleted_at == null))] | if length != 1 then error("Expected one active OpenBeacon Backend application; found \(length). Check the Coolify endpoint and token access.") elif (.[0].id | type != "number") then error("Backend application has no numeric id") elif (.[0].uuid | type != "string" or length == 0) then error("Backend application has no UUID") else .[0] | {id, uuid} end end' <<< "$applications")
          application_id=$(jq -er '.id | tostring' <<< "$application")
          application_uuid=$(jq -er '.uuid' <<< "$application")
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/deployments" | \
            jq -e --arg app "$application_id" 'if type != "array" then error("Unexpected deployments response") else all(.[]; (.application_id | tostring) != $app or (.status != "queued" and .status != "in_progress")) end' > /dev/null || {
              echo 'Unable to confirm that no backend deployment is active. Check Coolify before releasing.' >&2
              exit 1
            }
          runner=$(jq -cer 'if type != "array" then error("Expected an application list") else [.[] | select(.name == "OpenBeacon Scheduled Jobs" and (.deleted_at == null))] | if length != 1 then error("Expected one OpenBeacon Scheduled Jobs application") else .[0] | {id, uuid} end end' <<< "$applications")
          runner_id=$(jq -er '.id | numbers | tostring' <<< "$runner")
          runner_uuid=$(jq -er '.uuid | strings | select(length > 0)' <<< "$runner")
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/deployments" | \
            jq -e --arg app "$runner_id" 'if type != "array" then error("Unexpected deployments response") else all(.[]; (.application_id | tostring) != $app or (.status != "queued" and .status != "in_progress")) end' > /dev/null
          echo "uuid=${application_uuid}" >> "$GITHUB_OUTPUT"
          echo "runner_uuid=${runner_uuid}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish release tags
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
          SCHEDULED_JOBS_DIGEST: ${{ needs.publish.outputs.scheduled_jobs_digest }}
        run: |
          errors=$(mktemp)
          for release in "openbeacon-backend ${BACKEND_DIGEST}" "openbeacon-scheduled-jobs ${SCHEDULED_JOBS_DIGEST}"; do
            read -r image digest <<< "$release"
            ref="docker.io/lspsoftware/${image}:${VERSION}"
            if released=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2> "$errors"); then
              if [ "$released" != "$digest" ]; then
                echo "${ref} already exists. Bump serverVersion in apps/backend/src/version.ts before deploying." >&2
                exit 1
              fi
            elif ! grep -qxF "ERROR: ${ref}: not found" "$errors"; then
              echo "Could not check whether ${ref} exists:" >&2
              cat "$errors" >&2
              exit 1
            fi
          done
          for release in "openbeacon-backend ${BACKEND_DIGEST}" "openbeacon-scheduled-jobs ${SCHEDULED_JOBS_DIGEST}"; do
            read -r image digest <<< "$release"
            docker buildx imagetools create \
              --tag "docker.io/lspsoftware/${image}:${VERSION}" \
              --tag "docker.io/lspsoftware/${image}:latest-stable" \
              "docker.io/lspsoftware/${image}@${digest}"
          done
      - name: Trigger Coolify deployment
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BACKEND_UUID: ${{ steps.coolify_application.outputs.uuid }}
          COOLIFY_RUNNER_UUID: ${{ steps.coolify_application.outputs.runner_uuid }}
        run: |
          for resource_uuid in "$COOLIFY_BACKEND_UUID" "$COOLIFY_RUNNER_UUID"; do
          response=$(curl --fail-with-body --silent --show-error --request POST --get \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --data-urlencode "uuid=${resource_uuid}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/deploy")
          deployment_uuid=$(jq -er --arg app "$resource_uuid" '.deployments | map(select(.resource_uuid == $app)) | if length == 1 then .[0].deployment_uuid | select(type == "string" and length > 0) else empty end' <<< "$response")
          for _ in {1..120}; do
            status=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_ENDPOINT%/}/api/v1/deployments/${deployment_uuid}" | jq -er '.status | select(type == "string" and length > 0)')
            case "$status" in
              finished) break ;;
              failed|canceled*|cancelled*|stopped) echo "Deployment ${deployment_uuid} ended with status ${status}." >&2; exit 1 ;;
              queued|in_progress) sleep 10 ;;
              *) echo "Unexpected deployment status: ${status}" >&2; exit 1 ;;
            esac
          done
          if [ "$status" != finished ]; then
            echo "Deployment ${deployment_uuid} did not finish in time; check Coolify before releasing again." >&2
            exit 1
          fi
          done
