name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Trigger the Coolify deployment after publishing
        type: boolean
        default: false

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Deploys must be dispatched from main.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read backend version
        id: version
        run: |
          version=$(sed -nE 's/^export const serverVersion = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' apps/backend/src/version.ts)
          if [ -z "$version" ]; then
            echo 'Could not read the backend version.' >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Find Coolify applications and check for an active deployment
        id: coolify_application
        if: inputs.deploy
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          api="${COOLIFY_ENDPOINT%/}"
          api="${api%/api/v1}/api/v1"
          applications=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${api}/applications")
          for name in "OpenBeacon Backend" "OpenBeacon Scheduled Jobs"; do
            uuid=$(jq -er --arg name "$name" 'if type != "array" then error("Expected an application list from Coolify") else [.[] | select(.name == $name and .deleted_at == null)] | if length != 1 then error("Expected one active \($name) application; found \(length). Check the Coolify endpoint and token access.") else .[0].uuid | strings | select(length > 0) end end' <<< "$applications")
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${api}/deployments/applications/${uuid}" | \
              jq -e '(if type == "array" then . else .deployments end) | if type != "array" then error("Unexpected deployments response") else all(.[]; .status != "queued" and .status != "in_progress") end' > /dev/null || {
                echo "Unable to confirm that no ${name} deployment is active. Check Coolify before releasing." >&2
                exit 1
              }
            if [ "$name" = "OpenBeacon Backend" ]; then
              echo "uuid=${uuid}" >> "$GITHUB_OUTPUT"
            else
              echo "runner_uuid=${uuid}" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Require an unreleased version or a re-run of this commit's release
        id: release_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          errors=$(mktemp)
          reused=()
          for image in openbeacon-backend openbeacon-scheduled-jobs openbeacon-map-tiles; do
            ref="docker.io/lspsoftware/${image}:${VERSION}"
            if ! revision=$(docker buildx imagetools inspect "$ref" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2> "$errors"); then
              if ! grep -qxF "ERROR: ${ref}: not found" "$errors" && ! grep -qF "repository does not exist" "$errors"; then
                echo "Could not check whether ${ref} exists:" >&2
                cat "$errors" >&2
                exit 1
              fi
              continue
            fi
            if [ "$revision" != "$COMMIT" ]; then
              echo "${ref} already exists from another commit. Bump serverVersion in apps/backend/src/version.ts before deploying." >&2
              exit 1
            fi
            echo "${ref} was built from this commit; skipping its build."
            reused+=("$image")
          done
          echo "reused=${reused[*]}" >> "$GITHUB_OUTPUT"
      - if: ${{ !contains(steps.release_check.outputs.reused, 'openbeacon-backend') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            docker.io/lspsoftware/openbeacon-backend:${{ steps.version.outputs.version }}
            docker.io/lspsoftware/openbeacon-backend:latest-stable
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - if: ${{ !contains(steps.release_check.outputs.reused, 'openbeacon-scheduled-jobs') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/scheduled-jobs/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            docker.io/lspsoftware/openbeacon-scheduled-jobs:${{ steps.version.outputs.version }}
            docker.io/lspsoftware/openbeacon-scheduled-jobs:latest-stable
          cache-from: type=gha,scope=scheduled-jobs
          cache-to: type=gha,mode=max,scope=scheduled-jobs
      - if: ${{ !contains(steps.release_check.outputs.reused, 'openbeacon-map-tiles') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/map-tiles/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            docker.io/lspsoftware/openbeacon-map-tiles:${{ steps.version.outputs.version }}
            docker.io/lspsoftware/openbeacon-map-tiles:latest-stable
          cache-from: type=gha,scope=map-tiles
          cache-to: type=gha,mode=max,scope=map-tiles
      - name: Point latest-stable at reused images
        if: steps.release_check.outputs.reused != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REUSED: ${{ steps.release_check.outputs.reused }}
        run: |
          read -ra images <<< "$REUSED"
          for image in "${images[@]}"; do
            docker buildx imagetools create \
              --tag "docker.io/lspsoftware/${image}:latest-stable" \
              "docker.io/lspsoftware/${image}:${VERSION}"
          done
      - name: Trigger Coolify deployment
        if: inputs.deploy
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BACKEND_UUID: ${{ steps.coolify_application.outputs.uuid }}
          COOLIFY_RUNNER_UUID: ${{ steps.coolify_application.outputs.runner_uuid }}
        run: |
          api="${COOLIFY_ENDPOINT%/}"
          api="${api%/api/v1}/api/v1"
          for resource_uuid in "$COOLIFY_BACKEND_UUID" "$COOLIFY_RUNNER_UUID"; do
          response=$(curl --fail-with-body --silent --show-error --request POST --get \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --data-urlencode "uuid=${resource_uuid}" \
            "${api}/deploy")
          deployment_uuid=$(jq -er --arg app "$resource_uuid" '.deployments | map(select(.resource_uuid == $app)) | if length == 1 then .[0].deployment_uuid | select(type == "string" and length > 0) else empty end' <<< "$response")
          for _ in {1..120}; do
            status=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${api}/deployments/${deployment_uuid}" | jq -er '.status | select(type == "string" and length > 0)')
            case "$status" in
              finished) break ;;
              failed|canceled*|cancelled*|stopped) echo "Deployment ${deployment_uuid} ended with status ${status}." >&2; exit 1 ;;
              queued|in_progress) sleep 10 ;;
              *) echo "Unexpected deployment status: ${status}" >&2; exit 1 ;;
            esac
          done
          if [ "$status" != finished ]; then
            echo "Deployment ${deployment_uuid} did not finish in time; check Coolify before releasing again." >&2
            exit 1
          fi
          done
