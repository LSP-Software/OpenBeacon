name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Trigger the Coolify deployment after publishing
        type: boolean
        default: false

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require main branch for deployment
        if: inputs.deploy && github.ref != 'refs/heads/main'
        run: |
          echo 'Production images must be built from main.' >&2
          exit 1
      - uses: actions/checkout@v4
      - name: Prepare image tags
        id: image_tags
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^export const serverVersion = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' apps/backend/src/version.ts)
          if [ -z "$version" ]; then
            echo 'Could not read the backend version.' >&2
            exit 1
          fi
          branch=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[-.]+$//' | cut -c1-90)
          if [ -z "$branch" ]; then
            echo 'Branch name cannot be converted to an image tag.' >&2
            exit 1
          fi
          if [ "$BRANCH" != main ]; then
            branch="${branch}-$(printf '%s' "$BRANCH" | sha256sum | cut -c1-8)"
          fi
          {
            echo 'tags<<EOF'
            echo "docker.io/lspsoftware/openbeacon-backend:branch-${branch}"
            echo "docker.io/lspsoftware/openbeacon-backend:${version}-${branch}"
            if [ "$BRANCH" = main ]; then
              echo "docker.io/lspsoftware/openbeacon-backend:${version}"
              echo 'docker.io/lspsoftware/openbeacon-backend:latest-stable'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Find Coolify application and check for an active deployment
        id: coolify_application
        if: inputs.deploy
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          application=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/applications" | \
            jq -cer 'if type != "array" then error("Expected an application list from Coolify") else [.[] | select(.name == "OpenBeacon Backend" and (.deleted_at == null))] | if length != 1 then error("Expected one active OpenBeacon Backend application; found \(length). Check the Coolify endpoint and token access.") elif (.[0].id | type != "number") then error("Backend application has no numeric id") elif (.[0].uuid | type != "string" or length == 0) then error("Backend application has no UUID") else .[0] | {id, uuid} end end')
          application_id=$(jq -er '.id | tostring' <<< "$application")
          application_uuid=$(jq -er '.uuid' <<< "$application")
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/deployments" | \
            jq -e --arg app "$application_id" 'if type != "array" then error("Unexpected deployments response") else all(.[]; (.application_id | tostring) != $app or (.status != "queued" and .status != "in_progress")) end' > /dev/null || {
              echo 'Unable to confirm that no backend deployment is active. Check Coolify before releasing.' >&2
              exit 1
            }
          runner=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/applications" | \
            jq -cer 'if type != "array" then error("Expected an application list") else [.[] | select(.name == "OpenBeacon Scheduled Jobs" and (.deleted_at == null))] | if length != 1 then error("Expected one OpenBeacon Scheduled Jobs application") else .[0] | {id, uuid} end end')
          runner_id=$(jq -er '.id | numbers | tostring' <<< "$runner")
          runner_uuid=$(jq -er '.uuid | strings | select(length > 0)' <<< "$runner")
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/deployments" | \
            jq -e --arg app "$runner_id" 'if type != "array" then error("Unexpected deployments response") else all(.[]; (.application_id | tostring) != $app or (.status != "queued" and .status != "in_progress")) end' > /dev/null
          echo "uuid=${application_uuid}" >> "$GITHUB_OUTPUT"
          echo "runner_uuid=${runner_uuid}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/lspsoftware/openbeacon-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/scheduled-jobs/Dockerfile
          push: true
          tags: docker.io/lspsoftware/openbeacon-scheduled-jobs:${{ github.sha }}
      - name: Publish release tags
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          BACKEND_TAGS: ${{ steps.image_tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" "docker.io/lspsoftware/openbeacon-backend:${SHA}"
          done <<< "$BACKEND_TAGS"
          if [ "$BRANCH" = main ]; then
            docker buildx imagetools create --tag docker.io/lspsoftware/openbeacon-scheduled-jobs:latest-stable "docker.io/lspsoftware/openbeacon-scheduled-jobs:${SHA}"
          fi
      - name: Trigger Coolify deployment
        if: inputs.deploy
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BACKEND_UUID: ${{ steps.coolify_application.outputs.uuid }}
          COOLIFY_RUNNER_UUID: ${{ steps.coolify_application.outputs.runner_uuid }}
        run: |
          for resource_uuid in "$COOLIFY_BACKEND_UUID" "$COOLIFY_RUNNER_UUID"; do
          response=$(curl --fail-with-body --silent --show-error --request POST --get \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --data-urlencode "uuid=${resource_uuid}" \
            "${COOLIFY_ENDPOINT%/}/api/v1/deploy")
          deployment_uuid=$(jq -er --arg app "$resource_uuid" '.deployments | map(select(.resource_uuid == $app)) | if length == 1 then .[0].deployment_uuid | select(type == "string" and length > 0) else empty end' <<< "$response")
          for attempt in {1..120}; do
            status=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_ENDPOINT%/}/api/v1/deployments/${deployment_uuid}" | jq -er '.status | select(type == "string" and length > 0)')
            case "$status" in
              finished) break ;;
              failed|canceled*|cancelled*|stopped) echo "Deployment ${deployment_uuid} ended with status ${status}." >&2; exit 1 ;;
              queued|in_progress) sleep 10 ;;
              *) echo "Unexpected deployment status: ${status}" >&2; exit 1 ;;
            esac
          done
          if [ "$status" != finished ]; then
            echo "Deployment ${deployment_uuid} did not finish in time; check Coolify before releasing again." >&2
            exit 1
          fi
          done
