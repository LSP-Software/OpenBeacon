name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      version:
        description: Server version to release. Leave empty for serverVersion on main; set an older one to roll back.
        type: string
        required: false
      deploy:
        description: Trigger the Coolify deployment after pointing latest-stable at this version
        type: boolean
        default: false

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Deploys must be dispatched from main.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(sed -nE 's/^export const serverVersion = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' apps/backend/src/version.ts)}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "\"${version}\" is not a major.minor.patch version." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Find Coolify applications and check for an active deployment
        id: coolify_application
        if: inputs.deploy
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          api="${COOLIFY_ENDPOINT%/}"
          api="${api%/api/v1}/api/v1"
          applications=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${api}/applications")
          for name in "OpenBeacon Backend" "OpenBeacon Scheduled Jobs"; do
            uuid=$(jq -er --arg name "$name" 'if type != "array" then error("Expected an application list from Coolify") else [.[] | select(.name == $name and .deleted_at == null)] | if length != 1 then error("Expected one active \($name) application; found \(length). Check the Coolify endpoint and token access.") else .[0].uuid | strings | select(length > 0) end end' <<< "$applications")
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${api}/deployments/applications/${uuid}" | \
              jq -e '(if type == "array" then . else .deployments end) | if type != "array" then error("Unexpected deployments response") else all(.[]; .status != "queued" and .status != "in_progress") end' > /dev/null || {
                echo "Unable to confirm that no ${name} deployment is active. Check Coolify before releasing." >&2
                exit 1
              }
            if [ "$name" = "OpenBeacon Backend" ]; then
              echo "uuid=${uuid}" >> "$GITHUB_OUTPUT"
            else
              echo "runner_uuid=${uuid}" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Require published images for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in openbeacon-backend openbeacon-scheduled-jobs openbeacon-map-tiles; do
            ref="docker.io/lspsoftware/${image}:${VERSION}"
            docker buildx imagetools inspect "$ref" > /dev/null || {
              echo "${ref} is not published. Run the Build images workflow for this version first." >&2
              exit 1
            }
          done
      - name: Point latest-stable at this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in openbeacon-backend openbeacon-scheduled-jobs openbeacon-map-tiles; do
            docker buildx imagetools create \
              --tag "docker.io/lspsoftware/${image}:latest-stable" \
              "docker.io/lspsoftware/${image}:${VERSION}"
          done
      - name: Trigger Coolify deployment
        if: inputs.deploy
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BACKEND_UUID: ${{ steps.coolify_application.outputs.uuid }}
          COOLIFY_RUNNER_UUID: ${{ steps.coolify_application.outputs.runner_uuid }}
        run: |
          api="${COOLIFY_ENDPOINT%/}"
          api="${api%/api/v1}/api/v1"
          for resource_uuid in "$COOLIFY_BACKEND_UUID" "$COOLIFY_RUNNER_UUID"; do
          response=$(curl --fail-with-body --silent --show-error --request POST --get \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --data-urlencode "uuid=${resource_uuid}" \
            "${api}/deploy")
          deployment_uuid=$(jq -er --arg app "$resource_uuid" '.deployments | map(select(.resource_uuid == $app)) | if length == 1 then .[0].deployment_uuid | select(type == "string" and length > 0) else empty end' <<< "$response")
          for _ in {1..120}; do
            status=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${api}/deployments/${deployment_uuid}" | jq -er '.status | select(type == "string" and length > 0)')
            case "$status" in
              finished) break ;;
              failed|canceled*|cancelled*|stopped) echo "Deployment ${deployment_uuid} ended with status ${status}." >&2; exit 1 ;;
              queued|in_progress) sleep 10 ;;
              *) echo "Unexpected deployment status: ${status}" >&2; exit 1 ;;
            esac
          done
          if [ "$status" != finished ]; then
            echo "Deployment ${deployment_uuid} did not finish in time; check Coolify before releasing again." >&2
            exit 1
          fi
          done
