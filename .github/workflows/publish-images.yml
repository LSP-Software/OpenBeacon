name: Publish images to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: publish-images-${{ matrix.image }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openbeacon-backend
            file: Dockerfile
            cache: backend
          - image: openbeacon-scheduled-jobs
            file: apps/scheduled-jobs/Dockerfile
            cache: scheduled-jobs
          - image: openbeacon-map-tiles
            file: apps/map-tiles/Dockerfile
            cache: map-tiles
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Images must be published from main.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read backend version
        id: version
        run: |
          version=$(sed -nE 's/^export const serverVersion = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' apps/backend/src/version.ts)
          if [ -z "$version" ]; then
            echo 'Could not read the backend version.' >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Require an unpublished version or a re-run of this commit
        id: release_check
        env:
          REF: docker.io/lspsoftware/${{ matrix.image }}:${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          errors=$(mktemp)
          if ! revision=$(docker buildx imagetools inspect "$REF" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2> "$errors"); then
            if ! grep -qxF "ERROR: ${REF}: not found" "$errors" && ! grep -qF "repository does not exist" "$errors"; then
              echo "Could not check whether ${REF} exists:" >&2
              cat "$errors" >&2
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$revision" != "$COMMIT" ]; then
            echo "${REF} was already published from ${revision}. Bump serverVersion in apps/backend/src/version.ts to publish this commit." >&2
            exit 1
          fi
          echo "${REF} was already published from this commit; skipping it."
          echo "build=false" >> "$GITHUB_OUTPUT"
      - if: steps.release_check.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: docker.io/lspsoftware/${{ matrix.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
